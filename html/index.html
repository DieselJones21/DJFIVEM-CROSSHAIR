<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Crosshair</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="crosshair" class="crosshair hidden" aria-hidden="true"></div>
  <div id="hitmarker" class="hitmarker" aria-hidden="true"></div>

  <div id="app" class="app hidden">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DJ</span>
          <div>
            <p class="eyebrow">FiveM overlay</p>
            <h1>Crosshair</h1>
          </div>
        </div>
        <div class="top-actions">
          <button id="resetBtn" class="ghost" type="button">Reset</button>
          <button id="closeBtn" class="close" type="button" aria-label="Close menu">✕</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="controls">
          <div class="preview-card">
            <div class="preview-stage" id="previewStage"></div>
            <p id="styleName" class="style-name">Classic Cross</p>
            <p id="styleMeta" class="style-meta">Style 28 · Cross</p>
          </div>

          <label class="field">
            <span>Size <b id="sizeValue">100%</b></span>
            <input id="size" type="range" min="40" max="220" step="1" value="100" />
          </label>

          <label class="field">
            <span>Opacity <b id="opacityValue">92%</b></span>
            <input id="opacity" type="range" min="15" max="100" step="1" value="92" />
          </label>

          <label class="field color-field">
            <span>Color</span>
            <div class="color-row">
              <input id="color" type="color" value="#3EE0FF" />
              <div id="swatches" class="swatches"></div>
            </div>
          </label>

          <div class="toggles">
            <label class="toggle"><input id="customEnabled" type="checkbox" checked /><span>Custom crosshair</span></label>
            <label class="toggle"><input id="defaultEnabled" type="checkbox" /><span>Default GTA crosshair</span></label>
            <label class="toggle"><input id="aimOnly" type="checkbox" checked /><span>Show only while aiming</span></label>
            <label class="toggle"><input id="hideInFirstPerson" type="checkbox" /><span>Hide in first person</span></label>
            <label class="toggle"><input id="hitmarker" type="checkbox" checked /><span>Hitmarker</span></label>
          </div>
        </aside>

        <div class="library">
          <div class="library-head">
            <div id="cats" class="cats"></div>
            <input id="search" class="search" type="search" placeholder="Search styles..." />
          </div>
          <div id="grid" class="grid"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
